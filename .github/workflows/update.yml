name: Update YouTube posts
on:
  push:
    paths:
      - 'scripts/update_posts.py'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public YouTube feeds
        run: python scripts/update_posts.py
      - name: Commit updated data
        run: |
          if ! git diff --quiet -- data/posts.json data/status.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/posts.json data/status.json
            git commit -m 'Update public SNS feeds'
            git push
          fi
